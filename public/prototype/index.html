<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7931E">
<title>Vanny's Fresh Juice - prototype</title>
<style>
:root{
  --or:#F7931E; --or-d:#DD6A00; --or-s:#FFF0DC; --or-l:#FBD3A0;
  --ye:#FFC425; --ye-s:#FFF7D6;
  --gr:#3BA935; --gr-d:#23801F; --gr-s:#E5F5E1;
  --pu:#7A2C8F; --pu-s:#F3E6F7;
  --red:#D2382D; --red-s:#FDEBE8;
  --ink:#3A2716; --mut:#8C7660; --faint:#BBA892; --line:#F1E3D0;
  --page:#FFF8EE; --card:rgba(255,255,255,.9);
  --sh:0 1px 2px rgba(120,70,10,.06),0 4px 14px rgba(120,70,10,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;font-size:15px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:url(assets/mark.jpg) no-repeat center 60%/min(70vw,380px) auto;opacity:.07;mix-blend-mode:multiply}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.proto{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:80;background:var(--pu);color:#fff;font-size:11px;font-weight:600;padding:3px 12px;border-radius:0 0 10px 10px;letter-spacing:.3px}

/* layout */
.app{position:relative;z-index:1;display:flex;min-height:100dvh}
.side{width:248px;flex:none;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100dvh;overflow:auto}
.side .logo{display:block;width:100%;border-radius:14px;margin-bottom:14px;mix-blend-mode:multiply}
.side h6{margin:14px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint)}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:600;text-align:left;min-height:44px}
.nav:hover{background:var(--or-s);color:var(--ink)}
.nav.on{background:var(--or);color:#fff;box-shadow:0 4px 12px rgba(247,147,30,.35)}
.main{flex:1;min-width:0;padding:22px 28px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:24px;margin:0;flex:1}
.top .sub{color:var(--mut);font-size:13px;font-weight:500;display:block;margin-top:2px}
.ptop,.tabs,.fab{display:none}
.role{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;min-height:40px;font-size:14px}

/* phone */
@media (max-width:899px){
  .side{display:none}
  .main{padding:0 14px calc(96px + env(safe-area-inset-bottom))}
  .ptop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:rgba(255,248,238,.92);backdrop-filter:blur(10px);margin:0 -14px 12px;padding:calc(22px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
  .ptop .role{max-width:150px;font-size:13px}
  .proto{font-size:10px;padding:2px 10px;white-space:nowrap}
  .ptop img{width:34px;height:42px;object-fit:cover;border-radius:8px;mix-blend-mode:multiply}
  .ptop b{flex:1;font-size:18px}
  .top{display:none}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);padding:6px 0;min-height:52px}
  .tab.on{color:var(--or-d)}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--or),var(--or-d));color:#fff;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(221,106,0,.45)}
  .fab svg.i{width:26px;height:26px}
}

/* building blocks */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:899px){.g2,.g3{grid-template-columns:1fr}.g4{gap:10px}}
.card{background:var(--card);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.tile .l{font-size:12px;color:var(--mut);font-weight:600}
.tile .v{font-size:22px;font-weight:800;margin:4px 0 2px;letter-spacing:-.3px}
.tile .s{font-size:12px;color:var(--mut)}
@media (max-width:899px){.tile .v{font-size:18px}}
.hero{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(120deg,#F7931E 0%,#FBB040 55%,#FFC425 100%);box-shadow:0 10px 26px rgba(247,147,30,.35);display:flex;align-items:center;gap:16px;overflow:hidden;position:relative}
.hero h2{margin:0;font-size:22px}
.hero p{margin:4px 0 0;opacity:.95}
.hero .big{font-size:30px;font-weight:800;margin-top:10px}
.hero img{width:120px;border-radius:16px;margin-left:auto;box-shadow:0 6px 16px rgba(0,0,0,.15)}
@media (max-width:899px){.hero img{width:76px}.hero .big{font-size:24px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700;min-height:44px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--or-l)}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn.pri:hover{background:var(--or-d)}
.btn.grn{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap;min-height:36px;color:var(--mut)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bd{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:var(--gr-s);color:var(--gr-d)} .warn{background:var(--ye-s);color:#946200} .bad{background:var(--red-s);color:var(--red)} .info{background:var(--or-s);color:var(--or-d)} .pur{background:var(--pu-s);color:var(--pu)} .grey{background:#F3EEE7;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row.click{cursor:pointer;border-radius:10px}
.row.click:hover{background:var(--or-s);margin:0 -8px;padding-left:8px;padding-right:8px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t small{color:var(--mut);font-size:13px}
.row .amt{font-weight:800;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:600;font-size:12px;color:var(--mut)}
.fl{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.muted{color:var(--mut)} .small{font-size:13px} .red{color:var(--red)} .green{color:var(--gr-d)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:800;border-top:2px solid var(--line)}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.bar{height:8px;background:#F4EADC;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.sec{margin-top:16px}
.note{background:var(--pu-s);color:var(--pu);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
.dots{display:flex;gap:5px}
.dots span{width:22px;height:22px;border-radius:7px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

h3.kind{margin:18px 0 10px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
h3.kind:first-of-type{margin-top:4px}
.mixtag{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:1px}
table.t tr.grp td{background:var(--or-s);font-size:12px;font-weight:800;color:var(--or-d);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px}
table.t tr.sub td{font-weight:700;color:var(--mut);background:#FFFBF5}
h4.kindsm{margin:14px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--or-d)}
h4.kindsm:first-of-type{margin-top:0}
.manual{max-width:860px}
.manual .toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.manual .toc a{display:block;padding:9px 12px;border-radius:10px;background:var(--or-s);color:var(--ink);font-weight:600;text-decoration:none;font-size:14px}
.manual h3{font-size:19px;margin:26px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
.manual h3:first-child{margin-top:0;border-top:0;padding-top:0}
.manual h4{font-size:16px;margin:18px 0 6px}
.manual p,.manual li{line-height:1.55}
.manual ul,.manual ol{padding-left:22px}
.manual .note{margin:10px 0}
/* sell */
.sell{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media (max-width:1100px){.sell{grid-template-columns:1fr}}
.fcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.fcard .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fcard .hd b{flex:1}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sz{border:1px solid var(--line);border-radius:12px;background:var(--page);padding:7px 2px;text-align:center;min-height:56px}
.sz b{display:block;font-size:13px}
.sz small{display:block;font-size:11px;color:var(--mut)}
.sz:hover{border-color:var(--or)}
.sz:disabled{opacity:.4;cursor:not-allowed}
.sz .q{font-size:10px;font-weight:700;color:var(--gr-d)}
.cart{position:sticky;top:20px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:18px;line-height:1}
.cbar{display:none}
@media (max-width:1100px){
  .cart{display:none}
  .cbar{display:flex;position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:32;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);border:0;text-align:left}
}
@media (min-width:900px) and (max-width:1100px){.cbar{bottom:20px;left:276px}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-weight:700;font-size:13px;min-height:44px}
.seg button.on{background:var(--or-s);border-color:var(--or);color:var(--or-d)}

/* forms + sheets */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--or-l);border-color:var(--or)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(45,25,5,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:580px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet .sh h2{margin:0;font-size:19px;flex:1}
.x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
@media (min-width:900px){.ov{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
@media (min-width:900px){.toast{bottom:30px}}
.steps{display:flex;gap:4px;margin:6px 0 14px}
.steps div{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--faint)}
.steps div i{display:block;height:6px;border-radius:9px;background:#F1E6D6;margin-bottom:5px}
.steps div.done{color:var(--gr-d)} .steps div.done i{background:var(--gr)}
.steps div.now{color:var(--or-d)} .steps div.now i{background:var(--or)}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--gr)}
.more{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.more button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-weight:700;text-align:left;min-height:90px;box-shadow:var(--sh)}
.more button small{font-weight:500;color:var(--mut);font-size:12px}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--page);display:flex}
.lock .ph{flex:1;background:url(assets/juice-photo.jpg) center/cover;display:none}
@media (min-width:900px){.lock .ph{display:block}}
.lock .pane{width:100%;max-width:460px;margin:auto;padding:24px;text-align:center}
.lock img.lg{width:260px;max-width:80%;mix-blend-mode:multiply}
.pin{display:flex;gap:12px;justify-content:center;margin:20px 0 22px}
.pin i{width:15px;height:15px;border-radius:50%;border:2px solid var(--or)}
.pin i.f{background:var(--or)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.pad button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;font-weight:600;box-shadow:var(--sh)}
.pad button:active{background:var(--or-s)}
</style>
</head>
<body>
<div class="proto">PROTOTYPE · sample figures · nothing is saved</div>
<div id="lock" class="lock"></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="ptop"><img src="assets/mark.jpg" alt=""><b id="ptitle">Home</b><select class="role" id="role2" onchange="setRole(this.value)"></select></div>
    <div class="top"><h1 id="title">Home</h1><select class="role" id="role1" onchange="setRole(this.value)"></select><button class="btn pri" onclick="quickMenu()"><svg class="i"><use href="#plus"/></svg>New</button></div>
    <div id="page"></div>
  </main>
</div>
<nav class="tabs" id="tabs"></nav>
<button class="fab" onclick="quickMenu()" aria-label="New"><svg class="i"><use href="#plus"/></svg></button>
<div id="layer"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h3l2.7 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></symbol>
  <symbol id="truck" viewBox="0 0 24 24"><path d="M10 17h4V5H2v12h3"/><path d="M14 8h4l4 4v5h-3"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></symbol>
  <symbol id="make" viewBox="0 0 24 24"><path d="M6 8h12l-1.6 13H7.6z"/><path d="M14 8l2-6 3 1"/><path d="M6.6 13h10.8"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
  <symbol id="box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></symbol>
  <symbol id="basket" viewBox="0 0 24 24"><path d="M3 10h18l-2 10H5z"/><path d="M8 10l4-7 4 7"/><path d="M9 14v3M15 14v3"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8"/><path d="M22 21a7 7 0 0 0-4-6.3"/></symbol>
  <symbol id="receipt" viewBox="0 0 24 24"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></symbol>
  <symbol id="staff" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17a3.5 3.5 0 0 1 7 0"/><path d="M15 10h3M15 14h3"/></symbol>
  <symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-6M13 17V7M18 17v-4"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>

const kindHead = (k,l) => `<h3 class="kind">${k==='cocktail'?'🍹':'🍊'} ${l}</h3>`;
const lineTxt = l => `${l[2]} × ${fl(l[0]).name} ${sz(l[1]).label}`;
const sum = (a,f) => a.reduce((t,x) => t + f(x), 0);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const marginBd = m => `<span class="bd ${m>=30?'ok':m>=20?'warn':'bad'}">${m}%</span>`;
const state = {role:'owner', page:'home', cart:{}, pay:'Cash', ordFilter:'All', stockTab:'juice', custFilter:'All', recKind:'all', period:'This month', nb:{fid:'mango'}};

function allowed(id){ const p = ROLES[state.role].pages; return id==='reminders' || id==='help' || p==='all' || p.includes(id); }
function go(id){ location.hash = id; }
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function proto(msg){ closeSheet(); toast(msg || 'Prototype: this will be saved once the real app is built'); }
function sheet(title, body){
  $('#layer').innerHTML = `<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sh"><h2>${title}</h2><button class="x" onclick="closeSheet()" aria-label="Close">${ic('x')}</button></div>${body}</div></div>`;
}
function closeSheet(){ $('#layer').innerHTML=''; }
function setRole(r){ state.role = r; if(!allowed(state.page)) go('home'); else render(); }

function bars(data, color='#F7931E', h=150){
  const max = Math.max(...data.map(d => d.v)) * 1.15, w = 100/data.length;
  return `<svg viewBox="0 0 350 ${h+24}" style="width:100%;height:auto">${data.map((d,i) => {
    const bh = d.v/max*h, x = i*350/data.length + 8, bw = 350/data.length - 16;
    return `<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" rx="7" fill="${d.today?'#3BA935':color}" opacity="${d.today?1:.85}"/>
    <text x="${x+bw/2}" y="${h-bh-5}" font-size="10" text-anchor="middle" fill="#8C7660" font-weight="700">${Math.round(d.v/1000)}k</text>
    <text x="${x+bw/2}" y="${h+16}" font-size="11" text-anchor="middle" fill="#8C7660" font-weight="600">${d.d}</text>`; }).join('')}</svg>`;
}
function line(vals, labels){
  const max = Math.max(...vals)*1.1, min = Math.min(...vals)*.85, W=330, H=110;
  const pts = vals.map((v,i) => [10 + i*(W-20)/(vals.length-1), H - (v-min)/(max-min)*H + 6]);
  return `<svg viewBox="0 0 ${W} ${H+28}" style="width:100%;height:auto">
    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#F7931E" stroke-width="3" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#F7931E" stroke-width="2.5"/><text x="${p[0]}" y="${H+24}" font-size="9" text-anchor="middle" fill="#8C7660">${labels[i]}</text>`).join('')}
  </svg>`;
}

const cartLines = () => Object.entries(state.cart).filter(([,q])=>q>0).map(([k,q]) => { const [fid,s] = k.split('|'); return [fid,+s,q]; });

function cartHtml(){
  const ls = cartLines();
  if(!ls.length) return `<h3>${ic('cart')} This sale</h3><p class="muted small">Nothing yet. Tap a flavour and size.</p>`;
  return `<h3>${ic('cart')} This sale <button class="r btn sm" onclick="state.cart={};render()">Clear</button></h3>

function addCart(fid,s,d=1){
  const k = fid+'|'+s, have = state.cart[k]||0;
  if(d>0 && have >= fridge(fid,s)) return toast(`Only ${fridge(fid,s)} ${fl(fid).name} ${sz(s).label} in the fridge`);
  state.cart[k] = Math.max(0, have + d); render();
}
function checkout(){
  const total = cartTotal();
  sheet('Take payment', `
    ${cartLines().map(l=>`<div class="row"><div class="t">${lineTxt(l)}</div><div class="amt">${n0(lineAmt(l))}</div></div>`).join('')}

function completeSale(){
  const lines = cartLines(), cust = $('#ckCust').value;
  lines.forEach(([fid,s,q]) => { // oldest batch first
    BATCHES.filter(b=>b.fid===fid && b.status==='In the fridge').sort((a,b)=>a.days-b.days).forEach(b => { const take = Math.min(q, b.left[s]||0); if(take){ b.left[s]-=take; q-=take; } });
  });
  const sale = {t:new Date().toTimeString().slice(0,5), cust, lines, m:state.pay};
  SALES.push(sale); state.cart = {}; render();
  sheet('Sale done', `<div style="text-align:center"><img src="assets/logo.jpg" style="width:200px;mix-blend-mode:multiply"><p class="muted small">Receipt · ${TODAY} · ${sale.t}</p></div>

    <div class="grid g2"><button class="btn" onclick="proto('Prototype: opens WhatsApp with this receipt')">${ic('share')} Send on WhatsApp</button><button class="btn pri" onclick="closeSheet()">Next sale</button></div>`);
}

PAGES.make = () => {
  const week = BATCHES;
  const L = sum(week, litres), waste = sum(week, b=>b.waste);
  const avgCost = sum(week, b=>costPerL(b.fid)*litres(b)) / L;
  return `
  <div class="grid g4">
    <div class="tile"><div class="l">Made this week</div><div class="v">${L} L</div><div class="s">${week.length} batches</div></div>
    <div class="tile"><div class="l">Juice cost per litre</div><div class="v">${n0(avgCost)}</div><div class="s">fruit, sugar, ginger (average)</div></div>
    <div class="tile"><div class="l">Lost while making</div><div class="v">${(waste/(L+waste)*100).toFixed(1)}%</div><div class="s">${waste.toFixed(1)} L spilt or left over</div></div>
    <div class="tile"><div class="l">Spoiled in the fridge</div><div class="v red">6 bottles</div><div class="s">B-0135 Watermelon</div></div>

function nbSuggest(){
  const L = parseFloat($('#nbL').value)||0;
  $('#nb300').value = Math.floor(L*.3/.3); $('#nb500').value = Math.floor(L*.5/.5); $('#nb1000').value = Math.floor(L*.2); $('#nb5000').value = 0;
}
function nbCalc(){
  const fid = state.nb.fid, r = RECIPES[fid], L = parseFloat($('#nbL').value)||0, k = L/r.y;
  const n = Object.fromEntries(SIZES.map(s=>[s.id, parseInt($('#nb'+s.id).value)||0]));
  const bottled = sum(SIZES, s=>n[s.id]*s.l);
  const rows = r.ing.map(([nm,q]) => { const it = ING.find(i=>i.name===nm), need = q*k; return {nm, need, it, ok: it.qty>=need, cost: need*it.cost}; });
  const juice = sum(rows, x=>x.cost), pack = sum(SIZES, s=>n[s.id]*PACK[s.id]);
  const pk = SIZES.filter(s=>n[s.id]).map(s => { const it = PKG.find(p=>p.name===BOTTLE_ITEM[s.id]); return {s, it, ok: it.qty>=n[s.id]}; });
  $('#nbOut').innerHTML = `
    <div class="card" style="padding:12px">
      <b class="small">Fruit and sugar needed</b>
      ${rows.map(x=>`<div class="row"><div class="t">${x.nm}</div><div class="amt">${+x.need.toFixed(2)} ${x.it.unit}<small class="${x.ok?'green':'red'}">${x.ok?'have '+x.it.qty:'only '+x.it.qty+' in stock'}</small></div></div>`).join('')}
      ${r.water?`<div class="row"><div class="t">Clean water</div><div class="amt">${+(r.water*k).toFixed(1)} L</div></div>`:''}
      ${pk.map(p=>`<div class="row"><div class="t">${p.it.name}</div><div class="amt">${n[p.s.id]}<small class="${p.ok?'green':'red'}">${p.ok?'have '+p.it.qty:'only '+p.it.qty}</small></div></div>`).join('')}
      <div class="row"><div class="t">Bottled</div><div class="amt ${Math.abs(bottled-L)>.5?'red':''}">${+bottled.toFixed(1)} of ${L} L</div></div>
      <div class="row"><div class="t"><b>Batch cost</b><small>juice ${n0(juice)} + bottles ${n0(pack)}</small></div><div class="amt">${ugx(juice+pack)}</div></div>
      <div class="row"><div class="t">Cost per litre of juice</div><div class="amt">${n0(L?juice/L:0)}</div></div>
      <div class="row"><div class="t">Best before</div><div class="amt">${12 + r.bb}/11/2026</div></div>
    </div>`;
}

function remDay(ymd){

  const d = new Date(ymd+'T12:00'), t = new Date(TODAY_YMD+'T12:00'), diff = Math.round((d-t)/864e5);
  return diff === 1 ? 'Tomorrow' : `${DAYNAMES[d.getDay()]} ${ymd.slice(8)}/${ymd.slice(5,7)}`;
}

/* A real calendar file (.ics) with an alarm: iPhone and Android calendars both open it. */
function downloadIcs(id){
  const r = REMINDERS.find(x=>x.id===id);
  const esc = t => t.replace(/\\/g,'\\\\').replace(/[,;]/g, m=>'\\'+m).replace(/\n/g,'\\n');
  const start = r.when.replace(/[-:]/g,'') + '00';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Vannys Fresh Juice//Reminders//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:vj-reminder-${r.id}@vannys-fresh-juice`, 'DTSTAMP:20261112T090000Z', `DTSTART:${start}`, 'DURATION:PT30M',
    `SUMMARY:${esc("Vanny's: " + r.what)}`, `DESCRIPTION:${esc('For ' + r.who + ' · ' + r.src)}`,
    ...(r.repeat ? [r.repeat==='daily' ? 'RRULE:FREQ=DAILY' : 'RRULE:FREQ=WEEKLY'] : []),
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${esc(r.what)}`,'TRIGGER:-PT15M','END:VALARM','END:VEVENT','END:VCALENDAR'];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], {type:'text/calendar'}));

/* ---- HELP: shows user-manual.md (the one copy of the manual) ---- */
let MANUAL = null;
PAGES.help = () => {
  if(MANUAL === null){ fetch('user-manual.md').then(r=>r.ok?r.text():Promise.reject()).then(t=>{MANUAL=t; if(state.page==='help') render();}).catch(()=>{MANUAL=''; if(state.page==='help') render();}); return '<p class="muted">Opening the manual…</p>'; }
  if(!MANUAL) return '<p class="muted">The manual could not be opened.</p>';
  return mdToHtml(MANUAL);
};
function mdToHtml(md){
  const inline = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  const slug = t => 'm-' + t.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const lines = md.split(/\r?\n/), out = [], toc = [];
  let list = null, para = [], table = null;
  const flush = () => {
    if(para.length){ out.push(`<p>${inline(para.join(' '))}</p>`); para = []; }
    if(list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join('')}</${list.t}>`); list = null; }
    if(table){ const [h,...rows] = table.filter(r=>!/^\|[\s|:-]+\|$/.test(r)).map(r=>r.slice(1,-1).split('|').map(c=>c.trim()));
      out.push(`<div class="scroll"><table class="t"><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table></div>`); table = null; }
  };
  for(const l of lines){
    let m;
    if(!l.trim()){ flush(); continue; }
    if(l.startsWith('|')){ if(!table){ flush(); table = []; } table.push(l.trim()); continue; }
    if((m = l.match(/^(#{1,3}) (.*)/))){ flush(); const lv = m[1].length, id = slug(m[2]);
      if(lv===1) continue; if(lv===2) toc.push([id,m[2]]); out.push(`<h${lv+1} id="${id}">${inline(m[2])}</h${lv+1}>`); continue; }
    if(l.startsWith('> ')){ flush(); out.push(`<div class="note">${inline(l.slice(2))}</div>`); continue; }
    if((m = l.match(/^\s*- (.*)/))){ if(!list || list.t!=='ul'){ flush(); list = {t:'ul', items:[]}; } list.items.push(m[1]); continue; }
    if((m = l.match(/^\s*\d+\. (.*)/))){ if(!list || list.t!=='ol'){ flush(); list = {t:'ol', items:[]}; } list.items.push(m[1]); continue; }
    if(list && /^\s{2,}/.test(l)){ list.items[list.items.length-1] += ' ' + l.trim(); continue; }
    para.push(l.trim());
  }
  flush();
  return `<div class="manual"><div class="card"><h3>${ic('help')} Contents</h3><div class="toc">${toc.map(([id,t])=>`<a href="javascript:void(0)" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${t}</a>`).join('')}</div></div>
    <div class="card sec">${out.join('')}</div></div>`;
}

PAGES.more = () => `<div class="more">${ALL.filter(a=>allowed(a.id)&&!['home','sell','orders','make'].includes(a.id)).map(a=>`<button onclick="go('${a.id}')"><div class="ic info">${ic(a.icon)}</div>${a.label}</button>`).join('')}</div>
  <div class="note sec">This is a look-and-feel prototype for Vanny's Fresh Juice. The figures are made up. Nothing is saved.</div>`;

/* ============ quick menu ============ */
function quickMenu(){
  const items = [
    ['sell','cart','New sale',"closeSheet();go('sell')"],
    ['orders','truck','New order','newOrder()'],
    ['make','make','New batch',"closeSheet();go('make');setTimeout(newBatch,50)"],
    ['buying','basket','Buy fruit or supplies','newPurchase()'],
    ['expenses','receipt','Expense','newExpense()'],
    ['stock','drop','Write off spoiled','writeOff()'],
    ['reminders','bell','Reminder','newReminder()'],
  ].filter(i=>allowed(i[0]));
  sheet('New', `<div class="more">${items.map(i=>`<button onclick="${i[3]}"><div class="ic info">${ic(i[1])}</div>${i[2]}</button>`).join('')}</div>`);
}

/* ============ shell ============ */
function render(){
  const id = state.page;
  const navItem = ALL.find(a=>a.id===id) || {label:'More'};
  $('#title').innerHTML = `${navItem.label}<span class="sub">${TODAY}</span>`;
  $('#ptitle').textContent = navItem.short || navItem.label;
  $('#side').innerHTML = `<img class="logo" src="assets/logo.jpg" alt="Vanny's Fresh Juice">` + NAV.map(g => {
    const its = g.items.filter(a=>allowed(a.id)); if(!its.length) return '';
    return `<h6>${g.g}</h6>` + its.map(a=>`<button class="nav ${a.id===id?'on':''}" onclick="go('${a.id}')">${ic(a.icon)}${a.label}</button>`).join('');
  }).join('') + `<h6>Prototype</h6><button class="nav" onclick="lockNow()">${ic('padlock')}Lock</button>`;
  const tabs = [['home','home','Home'],['sell','cart','Sell'],['orders','truck','Orders'],['make','make','Make'],['more','grid','More']].filter(t=>t[0]==='more'||allowed(t[0]));
  $('#tabs').innerHTML = tabs.map(t=>`<button class="tab ${t[0]===id||(t[0]==='more'&&!['home','sell','orders','make'].includes(id))?'on':''}" onclick="go('${t[0]}')">${ic(t[1])}${t[2]}</button>`).join('');
  const opts = Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${state.role===k?'selected':''}>Viewing as: ${r.label}</option>`).join('');
  $('#role1').innerHTML = opts; $('#role2').innerHTML = opts.replace(/Viewing as: /g,'');
  $('#page').innerHTML = (PAGES[id] || PAGES.home)();
}
function route(){ const h = location.hash.slice(1) || 'home'; state.page = (PAGES[h] && (h==='more'||allowed(h))) ? h : 'home'; closeSheet(); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', route);

/* ============ lock screen (prototype: any 6 digits) ============ */
let pin = '';
function lockHtml(){
  return `<div class="ph"></div><div class="pane"><img class="lg" src="assets/logo.jpg" alt="Vanny's Fresh Juice">
    <p style="font-weight:700;margin:14px 0 0">Enter your PIN</p><p class="small muted" style="margin:4px 0 0">Prototype: any 6 digits open it</p>
    <div class="pin">${[0,1,2,3,4,5].map(i=>`<i class="${i<pin.length?'f':''}"></i>`).join('')}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="pinKey('${k}')">${k}</button>`).join('')}</div></div>`;
}
function pinKey(k){
  if(k==='⌫') pin = pin.slice(0,-1); else if(pin.length<6) pin += k;
  $('#lock').innerHTML = lockHtml();
  if(pin.length===6) setTimeout(() => { $('#lock').style.display='none'; pin=''; }, 200);
}
function lockNow(){ $('#lock').style.display='flex'; $('#lock').innerHTML = lockHtml(); }
document.addEventListener('keydown', e => { if($('#lock').style.display!=='none' && /^[0-9]$/.test(e.key)) pinKey(e.key); else if($('#lock').style.display!=='none' && e.key==='Backspace') pinKey('⌫'); });

$('#lock').innerHTML = lockHtml();
if(location.search.includes('open')) $('#lock').style.display='none'; // for screenshots only
route();
</script>
