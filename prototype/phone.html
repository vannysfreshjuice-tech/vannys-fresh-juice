<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vanny's Fresh Juice - phone view</title>
<style>
body{margin:0;background:#2b1d10;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 10px}
.phone{width:375px;height:812px;border:12px solid #111;border-radius:46px;overflow:hidden;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.5)}
iframe{border:0;width:375px;height:100%;display:block}
p{color:#f6d9b4;font-size:13px;margin:0 0 12px}
</style></head>
<body><p>Phone view (375 x 812, like an iPhone). Scroll inside the phone.</p>
<div class="phone"><iframe id="f"></iframe></div>
<script>
const q = new URLSearchParams(location.search);
const h = q.get('h'); if (h) document.querySelector('.phone').style.height = h + 'px';
document.getElementById('f').src = 'index.html' + (q.has('open') ? '?open' : '') + '#' + (q.get('p') || 'home');
</script></body></html>
